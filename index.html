<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>המוסך של טוטי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Secular+One&display=swap">
<style>
/* Layout: a sunny toy town. One full-screen play board under a slim top bar; every game is one big SVG scene; a garage collects the cars you earn. One bright daytime look on purpose. */
:root{
  --sky:#8fd3ff; --ink:#22303d; --paper:#fffaf0;
  --sun:#ffd23f; --sun-deep:#d4a300; --go:#22c55e; --go-deep:#15803d;
  --tile:#ffffff; --shadow:rgba(34,48,61,.18);
  --display:"Secular One","Varela Round",Arial,sans-serif;
  --body:"Varela Round",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;display:flex;flex-direction:column;direction:rtl}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:6;position:relative}
.round{width:58px;height:58px;border-radius:50%;border:none;background:var(--tile);box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:var(--ink)}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.round:focus-visible,.tile:focus-visible,.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.round svg{width:34px;height:34px}
.round.small{width:44px;height:44px;opacity:.75}
.round.small svg{width:24px;height:24px}
.progress{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:99px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--shadow);font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.progress svg{width:32px;height:32px;flex:none}
.progress.bump{animation:bump .5s}
.meter{width:clamp(50px,12vw,110px);height:12px;border-radius:99px;background:#e5e7eb;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#facc15,#fb923c);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes bump{40%{transform:scale(1.2)}}
#stage{flex:1;min-height:0;position:relative;background:linear-gradient(#8fd3ff 0 55%,#5bb043 55%)}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.caption{position:absolute;inset-inline:0;top:calc(80px + env(safe-area-inset-top, 0px));display:flex;justify-content:center;pointer-events:none;z-index:5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.caption span{background:var(--paper);border-radius:22px;padding:10px 22px;font-family:var(--display);font-size:clamp(22px,4.4vw,36px);box-shadow:0 5px 0 var(--shadow);opacity:0;transform:translateY(-10px) scale(.95);transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1);max-width:100%;text-align:center}
.caption span.on{opacity:1;transform:none}
.home{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2;padding-block:4px 16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.8vw,18px);max-width:1100px;width:100%;margin:auto}
.tile{border:none;border-radius:26px;background:var(--tile);box-shadow:0 7px 0 var(--shadow);cursor:pointer;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:clamp(15px,2.1vw,22px);color:var(--ink);min-width:0;animation:pop .5s backwards;position:relative}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.tile svg{width:100%;height:auto;max-height:17vh}
.tile .dots{display:flex;gap:3px;height:10px}
.tile .dots b{width:9px;height:9px;border-radius:50%;background:#e5e7eb}
.tile .dots b.on{background:var(--sun)}
.tile.garage{background:#ffe9a8}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (max-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile svg{max-height:12vh}}
.start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#8fd3ff 0 62%,#6cc551 62%);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow:hidden}
.start h1{font-family:var(--display);font-size:clamp(40px,9vw,88px);margin:0;color:var(--ink);text-shadow:0 5px 0 rgba(255,255,255,.75);text-wrap:balance;text-align:center;animation:pop .7s backwards}
.start .mascot{width:min(360px,70vw);animation:driveIn 1.4s cubic-bezier(.2,.9,.3,1.1) backwards .2s}
@keyframes driveIn{from{transform:translateX(-120vw)}}
.start .go{width:132px;height:132px;border-radius:50%;border:none;background:var(--go);box-shadow:0 9px 0 var(--go-deep);cursor:pointer;display:grid;place-items:center;animation:breathe 1.6s infinite 1.6s}
.start .go svg{width:62px;height:62px}
.start .go:active{transform:translateY(6px);box-shadow:0 3px 0 var(--go-deep)}
.start p{margin:0;font-size:16px;color:var(--ink);text-align:center}
@keyframes breathe{50%{transform:scale(1.07)}}
.tap{cursor:pointer}
.hint{animation:hint 1s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.14)}}
.wiggle{animation:wiggle .45s}
@keyframes wiggle{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.idle{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.spin{animation:spin .5s linear infinite}
.spinslow{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{animation:flash .35s steps(1) infinite}
@keyframes flash{50%{opacity:.15}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.cloud{animation:drift 46s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
.flame{animation:flame .4s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.18) scaleX(.9)}}
.party{position:absolute;inset:0;z-index:8;pointer-events:none}
.cheer{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cheer div{font-family:var(--display);font-size:clamp(44px,10vw,96px);color:var(--ink);background:var(--sun);border-radius:40px;padding:14px 40px;box-shadow:0 10px 0 var(--sun-deep);animation:cheer 2.4s forwards}
@keyframes cheer{0%{transform:scale(0) rotate(-10deg)}15%{transform:scale(1.15) rotate(3deg)}25%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.overlay{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(34,48,61,.55);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);border-radius:32px;box-shadow:0 12px 0 var(--shadow);padding:22px 24px 26px;width:min(560px,100%);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:92%;overflow:auto;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.card h2{margin:0;font-family:var(--display);font-size:clamp(28px,6vw,44px)}
.card .new{width:min(380px,80%);animation:driveIn 1.2s cubic-bezier(.2,.9,.3,1.1) backwards .3s}
.btn{font:inherit;font-family:var(--display);font-size:22px;border:none;border-radius:20px;padding:12px 30px;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-deep);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--go-deep)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--shadow);font-size:17px;padding:10px 18px}
.btn.danger{background:#fee2e2;color:#991b1b;box-shadow:0 5px 0 #fecaca;font-size:17px;padding:10px 18px}
.parents{text-align:start;width:100%;display:flex;flex-direction:column;gap:10px;font-size:15px}
.parents table{width:100%;border-collapse:collapse}
.parents td{padding:5px 0;border-bottom:1px solid #eee5d3}
.parents td:last-child{text-align:end;font-variant-numeric:tabular-nums}
.parents label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.parents input{width:22px;height:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="app">
  <div class="bar">
    <button class="round" id="homeBtn" aria-label="חזרה למסך הבית" hidden>
      <svg viewBox="0 0 40 40"><path d="M6 20 20 7l14 13" fill="none" stroke="#22303d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 18v15h20V18" fill="#ffd23f" stroke="#22303d" stroke-width="3.5" stroke-linejoin="round"/><rect x="17" y="24" width="6" height="9" fill="#22303d"/></svg>
    </button>
    <button class="round" id="soundBtn" aria-label="השתקה"><svg viewBox="0 0 40 40" id="soundIcon"></svg></button>
    <div class="progress" id="progress" aria-live="polite">
      <svg viewBox="0 0 40 40"><path d="M20 3l5 11 12 1.3-9 8.2 2.6 11.8L20 29.2 9.4 35.3 12 23.5 3 15.3 15 14z" fill="#ffd23f" stroke="#d4a300" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span id="starNum">0</span>
      <span class="meter" aria-hidden="true"><i id="meter"></i></span>
    </div>
    <button class="round small" id="parentBtn" aria-label="אזור הורים: לחיצה ארוכה">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6" fill="none" stroke="#22303d" stroke-width="3.5"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M8.7 31.3l4.2-4.2M27.1 12.9l4.2-4.2" stroke="#22303d" stroke-width="3.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="stage"></div>
  <div class="caption"><span id="cap"></span></div>
  <div class="start" id="start">
    <h1>המוסך של טוטי</h1>
    <svg class="mascot" viewBox="0 -10 290 160" id="startCar" aria-hidden="true"></svg>
    <button class="go" id="go" aria-label="יוצאים לדרך"><svg viewBox="0 0 40 40"><path d="M30 6 10 20l20 14z" fill="#fff"/></svg></button>
    <p>לוחצים, מפעילים ולומדים: צבעים, ספירה, צורות ומילים</p>
  </div>
  <div id="layer"></div>
</div>

<script>
// ================= storage =================
const SAVE_KEY = "tooti-v2";
const blank = () => ({ stars: 0, unlocked: ["tooti"], plays: {}, level: {}, seconds: 0, music: true, voice: true });
let S = blank();
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = { ...blank(), ...JSON.parse(raw) }; else { const old = +localStorage.getItem("tooti-stars"); if (old) S.stars = old; } } catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
const lvl = (k) => S.level[k] || 0;
const levelUp = (k) => { S.level[k] = lvl(k) + 1; save(); };

// ================= sound =================
let AC = null, muted = false;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, dur, type = "sine", vol = 0.18, when = 0, slideTo, dest) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest || a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, freq = 2500, vol = 0.12, type = "highpass") {
  const a = ac(); if (!a || muted) return;
  const len = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = type; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start();
}
const SFX = {
  honk() { tone(330, 0.22, "square", 0.11); tone(415, 0.22, "square", 0.09); tone(330, 0.25, "square", 0.11, 0.28); tone(415, 0.25, "square", 0.09, 0.28); },
  beep() { tone(520, 0.14, "square", 0.08); tone(520, 0.14, "square", 0.08, 0.2); },
  bigHorn() { tone(150, 0.6, "sawtooth", 0.08); tone(190, 0.6, "sawtooth", 0.06); },
  pop() { tone(500, 0.12, "sine", 0.2, 0, 1200); },
  ding() { tone(880, 0.25, "triangle", 0.18); tone(1320, 0.35, "triangle", 0.14, 0.12); },
  vroom(p = 1) { tone(70 * p, 1.0, "sawtooth", 0.08, 0, 190 * p); tone(110 * p, 1.0, "square", 0.035, 0, 260 * p); },
  rev(p = 1) { tone(90 * p, 0.25, "sawtooth", 0.07, 0, 160 * p); },
  boop() { tone(260, 0.18, "triangle", 0.15, 0, 200); },
  spray() { noise(0.6, 2500, 0.12); },
  water() { noise(1.6, 900, 0.08, "bandpass"); },
  glug() { tone(180, 0.09, "sine", 0.12, 0, 120); },
  click() { tone(900, 0.04, "square", 0.05); },
  siren(kind) { for (let i = 0; i < 3; i++) { if (kind === "police") { tone(700, 0.45, "square", 0.05, i * 0.9, 1300); tone(1300, 0.45, "square", 0.05, i * 0.9 + 0.45, 700); } else if (kind === "fire") { tone(600, 0.9, "sawtooth", 0.045, i * 0.9, 950); } else { tone(960, 0.42, "triangle", 0.11, i * 0.9); tone(770, 0.42, "triangle", 0.11, i * 0.9 + 0.45); } } },
  jingle() { [784, 659, 784, 880, 784, 659, 523].forEach((f, i) => tone(f, 0.22, "triangle", 0.12, i * 0.2)); },
  cheer() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, "triangle", 0.16, i * 0.12)); },
  fanfare() { [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, "square", 0.07, i * 0.15)); },
  wrong() { tone(300, 0.15, "triangle", 0.12, 0, 220); },
};
let musicTimer = 0, musicStep = 0, musicGain = null;
const TUNE = [523, 659, 784, 659, 587, 659, 523, 0, 587, 784, 880, 784, 659, 587, 523, 0];
const BASS = [262, 0, 196, 0, 220, 0, 196, 0];
function musicOn() {
  const a = ac(); if (!a || musicTimer) return;
  musicGain = a.createGain(); musicGain.gain.value = 0.35; musicGain.connect(a.destination);
  musicTimer = setInterval(() => {
    if (muted || !S.music || document.visibilityState !== "visible") return;
    const n = TUNE[musicStep % TUNE.length], b = BASS[musicStep % BASS.length];
    if (n) tone(n, 0.3, "triangle", 0.035, 0, undefined, musicGain);
    if (b && musicStep % 2 === 0) tone(b, 0.5, "sine", 0.05, 0, undefined, musicGain);
    musicStep++;
  }, 340);
}
const duck = (on) => { if (musicGain && AC) musicGain.gain.setTargetAtTime(on ? 0.12 : 0.35, AC.currentTime, 0.15); };
const buzz = (ms = 25) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ================= voice + caption =================
let heVoice = null;
function pickVoice() { const vs = speechSynthesis.getVoices(); heVoice = vs.find((v) => /^he|^iw/i.test(v.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const cap = document.getElementById("cap");
let capTimer = 0;
function say(text, show = text) {
  cap.textContent = show; cap.classList.add("on"); clearTimeout(capTimer);
  capTimer = setTimeout(() => cap.classList.remove("on"), 3000);
  if (muted || !S.voice || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "he-IL"; if (heVoice) u.voice = heVoice; u.rate = 0.9; u.pitch = 1.15; u.onstart = () => duck(true); u.onend = () => duck(false); speechSynthesis.speak(u); } catch (e) {}
}
const PRAISE = ["יופי!", "כל הכבוד!", "איזה אלוף!", "מדהים!", "וואו, מעולה!", "בדיוק!", "נהדר!"];
const praise = () => PRAISE[(Math.random() * PRAISE.length) | 0];

// ================= vehicles =================
const COLORS = { red: ["#ef4444", "#b91c1c", "אדום"], blue: ["#3b82f6", "#1d4ed8", "כחול"], yellow: ["#facc15", "#ca8a04", "צהוב"], green: ["#22c55e", "#15803d", "ירוק"], orange: ["#fb923c", "#c2410c", "כתום"], purple: ["#a855f7", "#7e22ce", "סגול"] };
const randColor = () => Object.values(COLORS)[(Math.random() * 6) | 0];
function wheel(cx, cy = 112, r = 27, on = true) {
  if (!on) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#22303d" stroke-width="4" stroke-dasharray="8 7" opacity=".5"/>`;
  return `<g transform="translate(${cx} ${cy})"><circle r="${r}" fill="#22303d"/><circle r="${r * 0.82}" fill="#2f3f4f"/><circle r="${r * 0.46}" fill="#d7dee7"/><g class="hub">${[0, 60, 120].map((a) => `<rect x="-2.5" y="${-r * 0.42}" width="5" height="${r * 0.84}" rx="2" fill="#94a3b8" transform="rotate(${a})"/>`).join("")}</g><circle r="${r * 0.13}" fill="#64748b"/></g>`;
}
function eyes(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="14" ry="15" fill="#fff" stroke="#22303d" stroke-width="2"/><g class="blink" style="transform-origin:0 0;transform-box:view-box"><circle cx="-4" cy="1" r="7" fill="#22303d"/><circle cx="-6.5" cy="-2.5" r="2.4" fill="#fff"/></g><path d="M-14 24 Q-1 33 13 24" fill="none" stroke="#22303d" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="14" cy="22" rx="6" ry="3.5" fill="#f9a8d4" opacity=".7"/></g>`;
}
const glass = (d) => `<path d="${d}" fill="#bfe6ff"/><path d="${d}" fill="url(#glint)" opacity=".9"/>`;
const shine = (d) => `<path d="${d}" fill="#fff" opacity=".28"/>`;
const shadow = (w = 128) => `<ellipse cx="144" cy="141" rx="${w}" ry="8" fill="#000" opacity=".16"/>`;
const DEFS = `<defs><linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#d9f1ff"/></linearGradient><pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#22303d"/><rect x="8" y="8" width="8" height="8" fill="#22303d"/></pattern></defs>`;
function vehicle(kind, o = {}) {
  const c = o.color, d = o.dark, w = o.wheels || [true, true];
  let s = "";
  switch (kind) {
    case "taxi": case "police": case "tooti": case "car": {
      const col = c || (kind === "taxi" ? "#facc15" : kind === "police" ? "#2563eb" : "#3b82f6"), dk = d || (kind === "taxi" ? "#ca8a04" : kind === "police" ? "#1e3a8a" : "#1d4ed8");
      s = shadow() + `<path d="M18 112V82Q18 60 46 58L84 56Q104 20 142 18H196Q226 20 240 56L252 58Q270 62 270 84V112Z" fill="${col}"/>` + shine("M50 64Q80 60 250 62Q262 64 264 74L40 74Q42 66 50 64Z") + glass("M96 56Q112 30 142 28H162V56Z") + glass("M172 28H194Q216 30 228 56H172Z") + `<rect x="18" y="98" width="252" height="14" rx="4" fill="${dk}"/><line x1="166" y1="60" x2="166" y2="98" stroke="${dk}" stroke-width="3"/><rect x="176" y="68" width="16" height="5" rx="2.5" fill="${dk}"/><rect x="258" y="72" width="12" height="15" rx="3" fill="#fca5a5"/><circle cx="24" cy="76" r="6" fill="#fff59d"/>`;

    <g id="rival" transform="translate(760 330)"><g transform="scale(.8)">${vehicle("race", { color: "#a855f7", dark: "#7e22ce" })}</g></g>
    <g id="me" class="tap" transform="translate(760 470)"><g transform="scale(.9)">${vehicle("race", { color: me[0], dark: me[1] })}</g></g>
    <g transform="translate(860 205)"><g id="pedal" class="tap"><circle r="62" fill="#22c55e" stroke="#15803d" stroke-width="8"/><text y="12" font-size="34" text-anchor="middle" fill="#fff" font-family="Secular One,Arial" direction="rtl">סע!</text></g></g>`);
  const meEl = stage.querySelector("#me"), rival = stage.querySelector("#rival"), lines = stage.querySelector("#lines"), countEl = stage.querySelector("#count"), pedal = stage.querySelector("#pedal");
  let x = 760, rx = 760, v = 0, phase = "count", off = 0;
  ["שלוש", "שתיים", "אחת", "סע!"].forEach((w, i) => after(500 + i * 950, () => { countEl.textContent = i < 3 ? String(3 - i) : "סע!"; countEl.setAttribute("opacity", "1"); box(countEl); countEl.animate([{ transform: "scale(1.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 300 }); say(w); tone(i < 3 ? 440 : 880, 0.25, "square", 0.08); if (i === 3) { phase = "race"; after(700, () => countEl.setAttribute("opacity", "0")); } }));
  const tapGo = () => { if (phase !== "race") return; v = Math.min(v + 55, 320); SFX.rev(1 + v / 300); box(pedal); pedal.animate([{ transform: "scale(.88)" }, { transform: "scale(1)" }], { duration: 150 }); };
  onTap(pedal, tapGo); onTap(meEl, tapGo);
  every((dt) => {
    if (phase !== "race") return;
    v *= Math.exp(-dt * 1.1); x -= v * dt; rx = Math.max(330, rx - 34 * dt); off = (off + v * dt) % 110;
    meEl.setAttribute("transform", `translate(${x} 470)`); rival.setAttribute("transform", `translate(${rx} 330)`); lines.setAttribute("transform", `translate(${-off} 0)`);
    meEl.querySelectorAll(".hub").forEach((h) => h.classList.toggle("spin", v > 20));
    if (x <= 60) { phase = "won"; meEl.querySelectorAll(".hub").forEach((h) => h.classList.remove("spin")); confetti(); SFX.cheer(); say("ניצחת במרוץ! " + praise(), "ניצחת! 🏁"); levelUp("race"); star("race"); after(4000, SCENES.race); }
  });
  idleFn = () => { if (phase === "race") { say("לחץ מהר על סע!"); hint(pedal); } };
  say("מרוץ! לחץ מהר מהר על הכפתור הירוק");
};

// 8. fuel station: empty and full; hold or tap the pump
SCENES.fuel = function () {
  const col = randColor();
  stage.innerHTML = svgScene(`${sky()}
    <rect x="0" y="440" width="1000" height="180" fill="#94a3b8"/><rect x="0" y="440" width="1000" height="8" fill="#cbd5e1"/>
    <rect x="200" y="120" width="600" height="40" rx="10" fill="#ef4444"/><rect x="210" y="160" width="20" height="290" fill="#cbd5e1"/><rect x="770" y="160" width="20" height="290" fill="#cbd5e1"/><text x="500" y="148" font-size="26" text-anchor="middle" fill="#fff" font-family="Secular One,Arial" direction="rtl">תחנת דלק</text>
    <path d="M680 350 Q620 350 610 400 Q600 430 545 410" fill="none" stroke="#22303d" stroke-width="8" stroke-linecap="round"/>
    <g id="pump" class="tap" transform="translate(680 230)"><rect x="0" y="0" width="100" height="220" rx="14" fill="#22c55e"/><rect x="14" y="16" width="72" height="44" rx="6" fill="#0f172a"/><text id="lcd" x="50" y="48" font-size="26" text-anchor="middle" fill="#4ade80" font-family="Secular One,Arial">0</text><rect x="22" y="80" width="56" height="70" rx="10" fill="#15803d"/><circle cx="50" cy="115" r="18" fill="#fff"/><path d="M44 106 58 115 44 124Z" fill="#15803d"/></g>
    <g id="fcar" transform="translate(250 300)">${vehicle("car", { color: col[0], dark: col[1] })}</g>
    <g transform="translate(400 250)"><rect x="-84" y="-76" width="168" height="104" rx="18" fill="#fff" opacity=".9"/><path d="M-60 0 A60 60 0 0 1 60 0" fill="none" stroke="#e5e7eb" stroke-width="18" stroke-linecap="round"/><path id="arc" d="M-60 0 A60 60 0 0 1 60 0" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/><g id="needle"><rect x="-3" y="-52" width="6" height="52" rx="3" fill="#22303d"/></g><circle r="9" fill="#22303d"/><text x="-60" y="22" font-size="17" fill="#ef4444" text-anchor="middle" font-family="Secular One,Arial">ריק</text><text x="60" y="22" font-size="17" fill="#15803d" text-anchor="middle" font-family="Secular One,Arial">מלא</text></g>`);
  const needle = stage.querySelector("#needle"), arc = stage.querySelector("#arc"), lcd = stage.querySelector("#lcd"), pump = stage.querySelector("#pump"), fcar = stage.querySelector("#fcar");
  let fill = 0, holding = false, done = false, half = false, glug = 0;
  const show = () => { needle.setAttribute("transform", `rotate(${-90 + fill * 180})`); arc.setAttribute("stroke-dashoffset", String(188.5 * (1 - fill))); arc.setAttribute("stroke", fill < 0.3 ? "#ef4444" : fill < 0.7 ? "#facc15" : "#22c55e"); lcd.textContent = Math.round(fill * 40); };
  show();
  pump.addEventListener("pointerdown", (e) => { e.preventDefault(); ac(); poke(); buzz(); holding = true; fill = Math.min(1, fill + 0.06); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => pump.addEventListener(ev, () => (holding = false)));
  every((dt) => {
    if (done) return;
    if (holding) { fill = Math.min(1, fill + dt * 0.22); glug += dt; if (glug > 0.25) { glug = 0; SFX.glug(); } }
    show();
    if (!half && fill >= 0.5) { half = true; say("חצי מיכל! עוד קצת"); }
    if (fill >= 1) { done = true; holding = false; say("מלא! המכונית מוכנה לנסוע", "מלא! ⛽"); sparkle(stage.querySelector("svg"), 400, 250); levelUp("fuel"); star("fuel"); after(1300, () => { SFX.vroom(); drive(fcar, -700, 1800, () => after(500, SCENES.fuel)); }); }
  });
  idleFn = () => { if (!done) { say("לחץ והחזק את המשאבה הירוקה"); hint(pump); } };
  say("המיכל ריק! לחץ והחזק את המשאבה");
};

// 9. garbage truck: sort by color, 2 → 3 bins
SCENES.sort = function () {
  const nb = lvl("sort") >= 2 ? 3 : 2;
  const keys = ["blue", "yellow", "green", "red"].sort(() => Math.random() - 0.5).slice(0, nb);
  const ITEMS = [(c) => `<path d="M-14 -34h28v10l8 8v44q0 6-6 6h-32q-6 0-6-6v-44l8-8z" fill="${c}"/><rect x="-10" y="-44" width="20" height="10" rx="3" fill="${c}"/>`, (c) => `<path d="M-30 -20Q-32 30 0 32Q32 30 30 -20Q20 -10 0 -24Q-20 -10 -30 -20Z" fill="${c}"/><path d="M-8 -24 0 -40 8 -24" fill="none" stroke="${c}" stroke-width="5"/>`, (c) => `<rect x="-28" y="-30" width="56" height="60" rx="6" fill="${c}"/><path d="M-28 -12h56M-28 8h56" stroke="#fff" stroke-width="3" opacity=".5"/>`];
  let left = 5, item = null;
  const binW = 170, gap = (1000 - nb * binW) / (nb + 1);
  stage.innerHTML = svgScene(`${sky()}
    <rect x="0" y="470" width="1000" height="150" fill="#94a3b8"/><rect x="0" y="466" width="1000" height="8" fill="#cbd5e1"/>
    ${keys.map((k, i) => { const x = gap + i * (binW + gap), [c, d] = COLORS[k]; return `<g class="tap bin" data-k="${k}" transform="translate(${x} 380)"><rect x="10" y="20" width="${binW - 20}" height="150" rx="14" fill="${c}"/><rect x="0" y="0" width="${binW}" height="28" rx="10" fill="${d}" class="lid"/><path d="M${binW / 2 - 20} 70h40M${binW / 2 - 20} 100h40" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/></g>`; }).join("")}
    <g id="truck" transform="translate(1100 300)">${vehicle("garbage")}</g>
    <g id="itemPos" transform="translate(500 250)"><g id="item"></g></g>`);
  const itemEl = stage.querySelector("#item"), bins = [...stage.querySelectorAll(".bin")];
  const next = () => { const k = keys[(Math.random() * nb) | 0]; item = k; itemEl.innerHTML = `<g class="bob"><g transform="scale(1.5)">${ITEMS[(Math.random() * 3) | 0](COLORS[k][0])}</g></g>`; itemEl.animate([{ transform: "translateY(-130px) scale(.3)" }, { transform: "translateY(0) scale(1)" }], { duration: 450, easing: "cubic-bezier(.3,1.5,.5,1)" }); say("לאיזה פח? " + COLORS[k][2]); };
  bins.forEach((b, i) => onTap(b, () => {
    if (!item) return;
    const k = b.dataset.k;
    if (k !== item) { wiggle(b); SFX.wrong(); say("זה הפח ה" + COLORS[k][2] + ". איפה ה" + COLORS[item][2] + "?"); return; }
    const dx = gap + i * (binW + gap) + binW / 2 - 500; item = null; SFX.pop();
    itemEl.animate([{ transform: "translate(0,0) scale(1)" }, { transform: `translate(${dx}px,80px) scale(.6)` }, { transform: `translate(${dx}px,150px) scale(.2)`, opacity: 0 }], { duration: 600, easing: "ease-in", fill: "forwards" }).onfinish = () => { itemEl.innerHTML = ""; itemEl.getAnimations().forEach((a) => a.cancel()); };
    const lid = b.querySelector(".lid"); box(lid); lid.animate([{ transform: "rotate(0)" }, { transform: "translateY(-14px) rotate(-12deg)" }, { transform: "rotate(0)" }], { duration: 500 });
    left--; say(praise() + " " + COLORS[k][2] + "!");
    if (left === 0) after(1000, () => { say("כל הזבל במקום! הנה משאית הזבל", "משאית הזבל! 🚛"); SFX.bigHorn(); drive(stage.querySelector("#truck"), -1300, 4200); levelUp("sort"); star("sort"); after(4800, SCENES.sort); });
    else after(900, next);
  }));
  idleFn = () => { if (item) { say("איפה הפח ה" + COLORS[item][2] + "?"); hint(bins.find((b) => b.dataset.k === item)); } };
  after(300, next);
};

// 10. my garage: the collection
SCENES.garage = function () {
  const cols = 5, cw = 190, ch = 150, x0 = (1000 - cols * cw) / 2, y0 = 110;
  stage.innerHTML = svgScene(`${DEFS}<rect width="1000" height="620" fill="#fde68a"/><rect width="1000" height="96" fill="#f59e0b"/><text x="500" y="64" font-size="42" text-anchor="middle" fill="#fff" font-family="Secular One,Arial" direction="rtl">המוסך שלי · ${S.unlocked.length}/${GARAGE.length}</text>
    ${GARAGE.map((g, i) => { const c = i % cols, r = Math.floor(i / cols), x = x0 + (cols - 1 - c) * cw, y = y0 + r * ch; const have = S.unlocked.includes(g.k); return `<g class="${have ? "tap gcar" : ""}" data-k="${g.k}" transform="translate(${x} ${y})"><rect x="6" y="4" width="${cw - 12}" height="${ch - 10}" rx="14" fill="${have ? "#fff" : "#f3e3b0"}" stroke="#d4a300" stroke-width="3"/><g class="mvwrap" transform="translate(16 28) scale(.55)"><g class="mv">${have ? vehicle(g.k) : `<g opacity=".18">${vehicle(g.k).replace(/fill="(?!url)[^"]+"/g, 'fill="#7c5e10"')}</g>`}</g></g>${have ? "" : `<g transform="translate(${cw / 2} ${ch / 2})"><rect x="-16" y="-6" width="32" height="26" rx="5" fill="#a16207"/><path d="M-10 -6v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#a16207" stroke-width="6"/></g>`}</g>`; }).join("")}`);
  stage.querySelectorAll(".gcar").forEach((el) => onTap(el, () => {
    const g = GARAGE.find((x) => x.k === el.dataset.k), mv = el.querySelector(".mv");
    playVehicleSound(g); say(g.line, g.name); lights(el, true);
    el.querySelectorAll(".hub").forEach((h) => h.classList.add("spin"));
    mv.animate([{ transform: "translate(0,0)" }, { transform: "translate(-40px,-6px)" }, { transform: "translate(0,0)" }], { duration: 1200, easing: "ease-in-out" }).onfinish = () => { el.querySelectorAll(".hub").forEach((h) => h.classList.remove("spin")); lights(el, false); };
  }));
  const left = GARAGE.length - S.unlocked.length, need = UNLOCK_EVERY - (S.stars % UNLOCK_EVERY);
  idleFn = null;
  const have = S.unlocked.length === 1 ? "במוסך יש מכונית אחת." : `במוסך יש ${S.unlocked.length} מכוניות.`;
  say(left ? `${have} עוד ${need === 1 ? "כוכב אחד" : need + " כוכבים"} ותקבל מכונית חדשה!` : "אספת את כל המכוניות! אלוף!");
};

// ================= home =================
const MENU = [
  { k: "light", label: "רמזור", art: () => `<svg viewBox="0 0 200 140"><rect x="76" y="6" width="48" height="128" rx="16" fill="#22303d"/><circle cx="100" cy="32" r="15" fill="#ff4d4d"/><circle cx="100" cy="70" r="15" fill="#ffd23f"/><circle cx="100" cy="108" r="15" fill="#3ee07a"/></svg>` },
  { k: "wash", label: "שטיפה", art: () => svgVehicle("car", { color: "#fb923c", dark: "#c2410c" }, `<circle cx="150" cy="70" r="16" fill="#8b5a2b"/><circle cx="210" cy="50" r="12" fill="#8b5a2b"/><circle cx="250" cy="0" r="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="3"/>`) },
  { k: "paint", label: "צבעים", art: () => svgVehicle("car", { color: "#a855f7", dark: "#7e22ce" }) },
  { k: "park", label: "חניה וצורות", art: () => `<svg viewBox="0 0 200 140"><rect x="10" y="20" width="180" height="100" rx="12" fill="#5b6170"/><circle cx="55" cy="70" r="22" fill="#fff"/><rect x="88" y="48" width="44" height="44" rx="4" fill="#fff"/><path d="M157 46 180 94 H134Z" fill="#fff"/></svg>` },
  { k: "rescue", label: "רכבי הצלה", art: () => svgVehicle("fire") },
  { k: "build", label: "בונים מכונית", art: () => svgVehicle("car", { color: "#3b82f6", dark: "#1d4ed8", wheels: [true, false] }) },
  { k: "race", label: "מרוץ", art: () => svgVehicle("race") },
  { k: "fuel", label: "תחנת דלק", art: () => `<svg viewBox="0 0 200 140"><rect x="60" y="10" width="70" height="124" rx="12" fill="#22c55e"/><rect x="70" y="22" width="50" height="30" rx="5" fill="#0f172a"/><text x="95" y="44" font-size="18" text-anchor="middle" fill="#4ade80" font-family="Secular One,Arial">40</text><path d="M130 70 Q160 70 156 110 Q152 132 120 128" fill="none" stroke="#22303d" stroke-width="7"/></svg>` },
  { k: "sort", label: "משאית זבל", art: () => svgVehicle("garbage") },
  { k: "garage", label: "המוסך שלי", art: () => `<svg viewBox="0 0 200 140"><path d="M10 50 100 8 190 50V134H10Z" fill="#f59e0b"/><rect x="34" y="62" width="132" height="72" fill="#7c2d12"/>${[70, 86, 102, 118].map((y) => `<rect x="34" y="${y}" width="132" height="4" fill="#9a3412"/>`).join("")}<path d="M100 18l6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9 13-2z" fill="#fde047"/></svg>` },
];
function home() {
  cleanup.forEach((f) => f()); cleanup = []; idleFn = null; clearTimeout(idle); current = null;
  document.getElementById("homeBtn").hidden = true;
  stage.innerHTML = svgScene(`${sky()}${road(520, 100)}`) + `<div class="home"><div class="grid">${MENU.map((m, i) => { const plays = S.plays[m.k] || 0; const dots = m.k === "garage" ? `<span style="font-size:14px">${S.unlocked.length}/${GARAGE.length}</span>` : `<span class="dots">${[0, 1, 2].map((d) => `<b class="${plays > d ? "on" : ""}"></b>`).join("")}</span>`; return `<button class="tile${m.k === "garage" ? " garage" : ""}" data-k="${m.k}" style="animation-delay:${i * 50}ms">${m.art()}<span>${m.label}</span>${dots}</button>`; }).join("")}</div></div>`;
  stage.querySelectorAll(".tile").forEach((t) => t.addEventListener("click", () => { ac(); SFX.click(); open(t.dataset.k); }));
}
function open(k) {
  cleanup.forEach((f) => f()); cleanup = []; current = k;
  document.getElementById("homeBtn").hidden = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  SCENES[k](); poke();
}
document.getElementById("homeBtn").addEventListener("click", () => { SFX.click(); home(); say("לאן נוסעים עכשיו?"); });

// ================= sound button =================
const soundIcon = document.getElementById("soundIcon"), soundBtn = document.getElementById("soundBtn");
function drawSound() { soundIcon.innerHTML = `<path d="M6 15h7l9-8v26l-9-8H6z" fill="#22303d"/>` + (muted ? `<path d="M27 14l10 12M37 14 27 26" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>` : `<path d="M27 13q6 7 0 14M31 9q10 11 0 22" fill="none" stroke="#22303d" stroke-width="3.5" stroke-linecap="round"/>`); soundBtn.setAttribute("aria-label", muted ? "הפעלת צליל" : "השתקה"); }
soundBtn.addEventListener("click", () => { muted = !muted; drawSound(); if (muted) try { speechSynthesis.cancel(); } catch (e) {} });
drawSound();

// ================= parents (long press 1.5 s) =================
const parentBtn = document.getElementById("parentBtn");
let holdT = 0, held = false;
parentBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); held = false; holdT = setTimeout(() => { held = true; parents(); }, 1500); parentBtn.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }], { duration: 1500 }); });
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => parentBtn.addEventListener(ev, () => clearTimeout(holdT)));
parentBtn.addEventListener("click", () => { if (!held) say("להורים: לחיצה ארוכה", "להורים: לחיצה ארוכה"); });
const GAME_NAMES = { light: "רמזור", wash: "שטיפה (ספירה)", paint: "צבעים", park: "חניה (צורות)", rescue: "רכבי הצלה", build: "בונים מכונית", race: "מרוץ", fuel: "תחנת דלק (ריק ומלא)", sort: "משאית זבל (מיון צבעים)" };
function parents() {
  const layer = document.getElementById("layer");
  const mins = Math.round(S.seconds / 60);
  layer.innerHTML = `<div class="overlay" role="dialog" aria-label="אזור הורים"><div class="card"><h2>אזור הורים</h2><div class="parents">
    <div>כוכבים: <b>${S.stars}</b> · מכוניות במוסך: <b>${S.unlocked.length}/${GARAGE.length}</b> · זמן משחק: <b>${mins} דק׳</b></div>
    <table>${Object.entries(GAME_NAMES).map(([k, n]) => `<tr><td>${n}</td><td>${S.plays[k] || 0} הצלחות</td></tr>`).join("")}</table>
    <label for="optMusic">מוזיקת רקע <input type="checkbox" id="optMusic" ${S.music ? "checked" : ""}></label>
    <label for="optVoice">הקראה קולית <input type="checkbox" id="optVoice" ${S.voice ? "checked" : ""}></label>
    <div class="row"><button class="btn danger" id="reset">איפוס התקדמות</button><button class="btn" id="closeP">סגירה</button></div>
  </div></div></div>`;
  layer.querySelector("#optMusic").onchange = (e) => { S.music = e.target.checked; save(); };
  layer.querySelector("#optVoice").onchange = (e) => { S.voice = e.target.checked; save(); };
  const r = layer.querySelector("#reset");
  r.onclick = () => { if (r.dataset.sure) { const m = S.music, v = S.voice; S = blank(); S.music = m; S.voice = v; save(); drawProgress(); layer.innerHTML = ""; home(); } else { r.dataset.sure = 1; r.textContent = "לחצו שוב לאישור האיפוס"; } };
  layer.querySelector("#closeP").onclick = () => { layer.innerHTML = ""; };
}
setInterval(() => { if (document.visibilityState === "visible" && document.getElementById("start").hidden) { S.seconds += 10; save(); } }, 10000);

// ================= start =================
document.getElementById("startCar").innerHTML = DEFS + `<g class="idle">${vehicle("tooti")}</g>`;
document.getElementById("go").addEventListener("click", () => {
  ac(); SFX.honk(); musicOn(); document.getElementById("start").hidden = true; home(); setTimeout(() => say("שלום! אני טוטי. לאן נוסעים?"), 500);
});
drawProgress();
const startAt = location.hash.slice(1);
home();
if (SCENES[startAt]) { document.getElementById("start").hidden = true; open(startAt); }
if (startAt === "home") document.getElementById("start").hidden = true;
</script>
</body>
